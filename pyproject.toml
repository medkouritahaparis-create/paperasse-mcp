[project]
name = "paperasse-mcp"
version = "0.1.0"
description = "MCP server answering questions on French administrative procedures from official sources only"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
